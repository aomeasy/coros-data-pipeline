<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>COROS Data Pipeline</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Tahoma, sans-serif; background: #0f0f1a; color: #e0e0e0; min-height: 100vh; }
.header { background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%); padding: 24px 40px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #2a2a4a; }
.header h1 { font-size: 24px; color: #e94560; font-weight: 700; }
.header .subtitle { font-size: 12px; color: #888; margin-top: 4px; }
.nav { display: flex; gap: 8px; }
.nav button { background: #1a1a2e; color: #ccc; border: 1px solid #2a2a4a; padding: 10px 20px; border-radius: 8px; cursor: pointer; font-size: 14px; transition: all .2s; }
.nav button:hover { background: #e94560; color: #fff; border-color: #e94560; }
.nav button.active { background: #e94560; color: #fff; border-color: #e94560; }
.container { padding: 30px 40px; max-width: 1200px; margin: 0 auto; }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 16px; margin-bottom: 30px; }
.stat-card { background: #1a1a2e; border: 1px solid #2a2a4a; border-radius: 12px; padding: 20px; text-align: center; }
.stat-card .number { font-size: 36px; font-weight: 700; color: #e94560; }
.stat-card .label { font-size: 12px; color: #888; margin-top: 4px; text-transform: uppercase; letter-spacing: 1px; }
.section { display: none; }
.section.active { display: block; }
h2 { font-size: 18px; margin-bottom: 16px; color: #e94560; }
table { width: 100%; border-collapse: separate; border-spacing: 0; margin-bottom: 30px; background: #1a1a2e; border-radius: 12px; overflow: hidden; border: 1px solid #2a2a4a; }
th { background: #16213e; padding: 12px 16px; text-align: left; font-size: 12px; color: #888; text-transform: uppercase; letter-spacing: .5px; border-bottom: 1px solid #2a2a4a; }
td { padding: 12px 16px; border-top: 1px solid #232745; font-size: 13px; }
tr:hover { background: #1f1f35; }
.badge { background: #533483; padding: 3px 10px; border-radius: 20px; font-size: 11px; font-weight: 600; }
.badge.run { background: #e94560; }
.badge.sleep { background: #533483; }
.badge.health { background: #0f3460; }
.empty { text-align: center; padding: 60px 20px; color: #555; font-size: 16px; }
</style>
</head>
<body>
<div class="header">
<div>
<h1>COROS Data Pipeline</h1>
<div class="subtitle">Local data pipeline for COROS smartwatch · Updated: <span id="updated">-</span></div>
</div>
<div class="nav">
<button onclick="showSection('activities')" id="btn-activities" class="active">Activities</button>
<button onclick="showSection('sleep')" id="btn-sleep">Sleep</button>
<button onclick="showSection('daily')" id="btn-daily">Daily Health</button>
</div>
</div>
<div class="container">
<div class="stats">
<div class="stat-card"><div class="number" id="s-acts">0</div><div class="label">Activities</div></div>
<div class="stat-card"><div class="number" id="s-sleep">0</div><div class="label">Sleep Records</div></div>
<div class="stat-card"><div class="number" id="s-daily">0</div><div class="label">Daily Health</div></div>
</div>
<div id="activities" class="section active">
<h2>Recent Activities</h2>
<div id="t-activities"></div>
</div>
<div id="sleep" class="section">
<h2>Sleep Data</h2>
<div id="t-sleep"></div>
</div>
<div id="daily" class="section">
<h2>Daily Health</h2>
<div id="t-daily"></div>
</div>
</div>
<script>
function fmtPace(s){if(!s)return"-";var m=Math.floor(s/60),sec=Math.floor(s%60);return m+":"+(sec<10?"0":"")+sec;}
function fmtDur(s){if(!s)return"-";var h=Math.floor(s/3600),m=Math.floor((s%3600)/60);return h>0?h+"h "+m+"m":m+"m";}
function fmtDist(m){if(!m)return"-";return m>=1000?(m/1000).toFixed(2)+" km":m.toFixed(0)+" m";}
function fmtDate(s){if(!s)return"-";return s.toString().replace("T"," ").substring(0,16);}
function esc(s){if(s==null)return"-";return String(s).replace(/</g,"&lt;").replace(/>/g,"&gt;");}

function renderTable(cols, rows){
if(!rows||rows.length===0) return '<div class="empty">No data yet — waiting for first sync...</div>';
var h='<table><thead><tr>';
cols.forEach(c=>h+='<th>'+c+'</th>');
h+='</tr></thead><tbody>';
rows.forEach(r=>{
h+='<tr>';
cols.forEach(c=>{
var v=r[c]; if(v==null) v="-";
h+='<td>'+esc(v)+'</td>';
});
h+='</tr>';
});
h+='</tbody></table>';
return h;
}

function showSection(n){
document.querySelectorAll('.section').forEach(s=>s.classList.remove('active'));
document.querySelectorAll('.nav button').forEach(b=>b.classList.remove('active'));
document.getElementById(n).classList.add('active');
document.getElementById('btn-'+n).classList.add('active');
}

async function load(){
try{
var r=await fetch('data.json?t='+Date.now());
if(!r.ok) throw new Error('data.json not found');
var d=await r.json();
}catch(e){
document.getElementById('t-activities').innerHTML='<div class="empty">data.json not found — GitHub Actions will generate it on next sync</div>';
document.getElementById('t-sleep').innerHTML='';
document.getElementById('t-daily').innerHTML='';
return;
}

document.getElementById('s-acts').textContent=d.stats?.activities_count||0;
document.getElementById('s-sleep').textContent=d.stats?.sleep_count||0;
document.getElementById('s-daily').textContent=d.stats?.daily_count||0;

var acts=(d.activities||[]).map(a=>({
Date:fmtDate(a.start_time),
Sport:'<span class="badge run">'+esc(a.sport_type||'run')+'</span>',
Distance:fmtDist(a.distance_m),
Duration:fmtDuration(a.duration_s),
'Pace (s/km)':fmtPace(a.avg_pace_s),
'Avg HR':a.avg_hr||'-',
'Score':a.score||'-',
'Ascent (m)':a.ascent_m||'-'
}));
document.getElementById('t-activities').innerHTML=renderTable(
['Date','Sport','Distance','Duration','Pace (s/km)','Avg HR','Score','Ascent (m)'], acts);

var sleep=(d.sleep||[]).map(s=>({
Date:s.date,
'Score':s.sleep_score?'<span class="badge sleep">'+s.sleep_score+'</span>':'-',
'Duration':fmtDuration((s.duration_min||0)*60),
'Deep %':s.deep_sleep_pct||'-',
'Light %':s.light_sleep_pct||'-',
'REM %':s.rem_sleep_pct||'-',
'Awake (min)':s.awake_min||'-',
'HRV':s.hrv||'-',
'Resting HR':s.resting_hr||'-'
}));
document.getElementById('t-sleep').innerHTML=renderTable(
['Date','Score','Duration','Deep %','Light %','REM %','Awake (min)','HRV','Resting HR'], sleep);

var daily=(d.daily||[]).map(x=>({
Date:x.date,
'Sleep Score':x.sleep_score?'<span class="badge health">'+x.sleep_score+'</span>':'-',
'Steps':x.steps?x.steps.toLocaleString():'-',
'Stress':x.stress_score||'-',
'Avg HR':x.avg_hr||'-',
'Max HR':x.max_hr||'-',
'Calories':x.calories_burned?x.calories_burned.toLocaleString():'-'
}));
document.getElementById('t-daily').innerHTML=renderTable(
['Date','Sleep Score','Steps','Stress','Avg HR','Max HR','Calories'], daily);

document.getElementById('updated').textContent=new Date().toLocaleString('th-TH');
}

load();
</script>
</body>
</html>
