<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>COROS Dashboard</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
:root{
  --bg:#0a0a0f;
  --sidebar:#12121a;
  --sidebar-hover:rgba(255,255,255,0.08);
  --sidebar-active:#4d9bfb;
  --content-bg:#0a0a0f;
  --card:#16161f;
  --card-elevated:#1e1e2a;
  --text:#ffffff;
  --muted:#8b8b9a;
  --accent:#4d9bfb;
  --status-green:#4ade80;
  --status-yellow:#fbbf24;
  --status-red:#fb4d4d;
  --success:#4ade80;
  --warning:#fbbf24;
  --info:#4d9bfb;
  --border:rgba(255,255,255,0.08)
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--content-bg);color:var(--text);min-height:100vh;padding-bottom:70px}
.topbar{padding:16px 20px 8px;display:flex;justify-content:space-between;align-items:center}
.brand h1{font-size:16px;color:var(--text);font-weight:700}
.brand .sub{font-size:11px;color:rgba(255,255,255,0.5);margin-top:2px}
.tabbar{position:fixed;left:0;right:0;bottom:0;background:var(--sidebar);border-top:1px solid var(--border);display:flex;z-index:1000;padding:6px 0 max(6px, env(safe-area-inset-bottom))}
.tabbar a{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;color:var(--muted);text-decoration:none;font-size:10px}
.tabbar a .icon{font-size:18px}
.tabbar a.active{color:var(--accent)}
.main{padding:0 16px 24px;max-width:480px;margin:0 auto}
.header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
.header h2{font-size:22px}
.breadcrumb{font-size:11px;color:var(--muted)}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px;margin-bottom:20px}
.card{background:var(--card);border-radius:10px;padding:16px;border:1px solid var(--border)}
.card .label{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:0.5px;margin-bottom:6px}
.card .val{font-size:24px;font-weight:700}
.card .sub{font-size:11px;color:var(--muted);margin-top:4px}
.section{background:var(--card);border-radius:10px;padding:18px;margin-bottom:16px;border:1px solid var(--border)}
.section h3{font-size:14px;margin-bottom:12px;display:flex;align-items:center;gap:6px}
.sect-icon{font-size:16px}
table{width:100%;border-collapse:collapse;font-size:12px}
th{text-align:left;padding:8px 10px;background:var(--card-elevated);color:var(--muted);font-weight:600;border-bottom:1px solid var(--border)}
td{padding:8px 10px;border-bottom:1px solid var(--border)}
tr:hover td{background:var(--card-elevated)}
.badge{display:inline-block;padding:2px 6px;border-radius:4px;font-size:10px;font-weight:600;background:var(--info);color:#fff}
.badge.ok{background:var(--success)}
.badge.warn{background:var(--warning);color:#1a1a2e}
.badge.danger{background:var(--status-red)}
.stage-bar{display:flex;height:20px;border-radius:4px;overflow:hidden;margin-top:8px}
.stage-deep{background:#7c3aed}
.stage-light{background:#3b82f6}
.stage-rem{background:#f59e0b}
.stage-awake{background:var(--status-red)}
.legend{display:flex;gap:12px;margin-top:8px;font-size:11px;color:var(--muted)}
.legend-dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:4px}
.empty{text-align:center;padding:40px;color:var(--muted)}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
canvas{max-width:100%}
.gauge-wrap{text-align:center;padding:16px}
.gauge-needle{width:4px;height:60px;background:var(--accent);position:absolute;left:50%;bottom:0;transform-origin:bottom center;transition:transform 0.5s}

/* ===== Recovery Ring (Whoop-style) ===== */
.recovery-ring-section{text-align:center;padding:24px 16px;margin-bottom:20px}
.ring-wrap{position:relative;width:180px;height:180px;margin:0 auto}
.ring-wrap svg{transform:rotate(-90deg)}
.ring-track{fill:none;stroke:var(--card-elevated);stroke-width:12}
.ring-progress{fill:none;stroke-width:12;stroke-linecap:round;transition:stroke-dasharray 0.6s ease, stroke 0.6s ease}
.ring-progress.status-green{stroke:var(--status-green)}
.ring-progress.status-yellow{stroke:var(--status-yellow)}
.ring-progress.status-red{stroke:var(--status-red)}
.ring-center{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);text-align:center}
.ring-center .pct{font-size:36px;font-weight:800;line-height:1}
.ring-center .lbl{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:0.5px;margin-top:4px}
.ring-status-text{font-size:13px;font-weight:600;margin-top:12px;letter-spacing:1px}
.ring-status-text.status-green{color:var(--status-green)}
.ring-status-text.status-yellow{color:var(--status-yellow)}
.ring-status-text.status-red{color:var(--status-red)}

/* ===== Triple-ring row (Recovery big + Sleep/Strain mini, Whoop-style) ===== */
.triple-ring-row{display:flex;justify-content:center;gap:20px;margin-top:18px;flex-wrap:wrap}
.mini-ring-wrap{position:relative;width:92px;height:92px}
.mini-ring-wrap svg{transform:rotate(-90deg)}
.mini-ring-track{fill:none;stroke:var(--card-elevated);stroke-width:8}
.mini-ring-progress{fill:none;stroke-width:8;stroke-linecap:round;transition:stroke-dasharray 0.6s ease, stroke 0.6s ease}
.mini-ring-progress.status-green{stroke:var(--status-green)}
.mini-ring-progress.status-yellow{stroke:var(--status-yellow)}
.mini-ring-progress.status-red{stroke:var(--status-red)}
.mini-ring-progress.status-empty{stroke:var(--border)}
.mini-ring-center{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);text-align:center}
.mini-ring-center .pct{font-size:17px;font-weight:800;line-height:1}
.mini-ring-item{text-align:center}
.mini-ring-item .lbl{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:0.5px;margin-top:6px}

/* ===== Activity summary card (merged distance/pace/etc with context) ===== */
.activity-card{background:var(--card-elevated);border-radius:10px;padding:16px;margin-top:4px}
.activity-card .a-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.activity-card .a-sport{font-size:13px;font-weight:700}
.activity-card .a-date{font-size:11px;color:var(--muted)}
.activity-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(80px,1fr));gap:10px}
.activity-stats .a-stat .a-val{font-size:16px;font-weight:700}
.activity-stats .a-stat .a-lbl{font-size:10px;color:var(--muted);text-transform:uppercase}

/* metric value color coding (used by card()/statusClass helpers in app.js) */
.val.status-green{color:var(--status-green)}
.val.status-yellow{color:var(--status-yellow)}
.val.status-red{color:var(--status-red)}

/* narrative inline severity coloring (used by colorizeNarrative() in app.js) */
.tag-good{color:var(--status-green);font-weight:600}
.tag-warn{color:var(--status-yellow);font-weight:600}
.tag-bad{color:var(--status-red);font-weight:600}
</style>
</head>
<body>
<div class="topbar">
  <div class="brand">
    <h1>COROS</h1>
    <div class="sub">Health Dashboard</div>
  </div>
</div>
<main class="main" id="main"></main>
<nav class="tabbar">
<a href="#" class="active" data-page="dashboard"><span class="icon">🏠</span>Dashboard</a>
<a href="#" data-page="sleep"><span class="icon">🌙</span>Sleep</a>
<a href="#" data-page="recovery"><span class="icon">⚡</span>Recovery</a>
<a href="#" data-page="breathing"><span class="icon">🫁</span>Breathing</a>
<a href="#" data-page="journal"><span class="icon">📓</span>Journal</a>
<a href="#" data-page="activities"><span class="icon">🏃</span>Activities</a>
</nav>
<script src="app.js"></script>

</body>
</html>
