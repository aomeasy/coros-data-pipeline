<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>COROS Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
/* ============================================================
   TOKENS
   Ink-cool dark ground, one amber "signal" accent doubling as
   the caution status color, desaturated green/red for the two
   remaining recovery bands.
   ============================================================ */
:root{
  --bg:#0b0d10;
  --surface:#101317;
  --surface-2:#161a1f;
  --hairline:rgba(255,255,255,0.08);
  --hairline-soft:rgba(255,255,255,0.05);
  --text:#edeff1;
  --text-dim:#8a929b;
  --text-faint:#565e67;

  --signal:#e8a33d;      /* accent + "moderate/caution" */
  --signal-dim:rgba(232,163,61,0.14);
  --good:#46c685;
  --good-dim:rgba(70,198,133,0.14);
  --bad:#e5566b;
  --bad-dim:rgba(229,86,107,0.14);

  --font-sans:'IBM Plex Sans',-apple-system,BlinkMacSystemFont,sans-serif;
  --font-mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:var(--font-sans);background:var(--bg);color:var(--text);min-height:100vh;padding-bottom:76px;font-size:15px;line-height:1.5}
:focus-visible{outline:2px solid var(--signal);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.num{font-family:var(--font-mono);font-variant-numeric:tabular-nums}

/* ===== Topbar ===== */
.topbar{padding:22px 20px 14px;display:flex;justify-content:space-between;align-items:baseline;border-bottom:1px solid var(--hairline-soft)}
.brand h1{font-size:15px;font-weight:600;letter-spacing:0.02em}
.brand .sub{font-family:var(--font-mono);font-size:11px;color:var(--text-faint);margin-top:3px}
.live-dot{width:6px;height:6px;border-radius:50%;background:var(--good);display:inline-block;margin-right:6px;box-shadow:0 0 0 3px var(--good-dim)}
.live-label{font-family:var(--font-mono);font-size:11px;color:var(--text-dim)}

/* ===== Tab bar ===== */
.tabbar{position:fixed;left:0;right:0;bottom:0;background:rgba(11,13,16,0.92);backdrop-filter:blur(10px);border-top:1px solid var(--hairline);display:flex;z-index:1000;padding:8px 0 max(8px, env(safe-area-inset-bottom))}
.tabbar a{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:4px 2px;color:var(--text-faint);text-decoration:none;font-size:10px;position:relative}
.tabbar a .icon{font-size:17px;filter:grayscale(1);opacity:0.55}
.tabbar a.active{color:var(--text)}
.tabbar a.active .icon{filter:none;opacity:1}
.tabbar a.active::before{content:'';position:absolute;top:-9px;left:50%;transform:translateX(-50%);width:14px;height:2px;background:var(--signal);border-radius:2px}

/* ===== Layout ===== */
.main{padding:4px 20px 24px;max-width:480px;margin:0 auto}
.header{margin:26px 0 18px}
.header h2{font-size:19px;font-weight:600}
.breadcrumb{font-family:var(--font-mono);font-size:11px;color:var(--text-faint);margin-top:2px}

/* section = hairline-separated block, NOT a bordered card */
.section{padding:22px 0;border-top:1px solid var(--hairline-soft)}
.section:first-child{border-top:none;padding-top:6px}
.section h3{font-size:12px;font-weight:600;color:var(--text-dim);letter-spacing:0.03em;margin-bottom:14px;display:flex;align-items:center;gap:7px}
.sect-icon{font-size:14px;opacity:0.85}

/* ===== Hero recovery ring — free-floating, no card chrome ===== */
.recovery-ring-section{text-align:center;padding:8px 0 26px;border-top:none}
.ring-wrap{position:relative;width:188px;height:188px;margin:0 auto}
.ring-wrap svg{transform:rotate(-90deg)}
.ring-track{fill:none;stroke:var(--surface-2);stroke-width:10}
.ring-progress{fill:none;stroke-width:10;stroke-linecap:round;transition:stroke-dashoffset 1s cubic-bezier(.4,0,.2,1)}
.ring-progress.status-green{stroke:var(--good)}
.ring-progress.status-yellow{stroke:var(--signal)}
.ring-progress.status-red{stroke:var(--bad)}
.ring-center{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);text-align:center}
.ring-center .pct{font-family:var(--font-mono);font-size:40px;font-weight:600;line-height:1;letter-spacing:-0.02em}
.ring-center .lbl{font-size:11px;color:var(--text-dim);margin-top:5px}
.band-pill{display:inline-flex;align-items:center;gap:6px;margin-top:16px;padding:4px 12px;border-radius:20px;font-size:11px;font-weight:600;letter-spacing:0.03em;border:1px solid currentColor}
.band-pill .dot{width:6px;height:6px;border-radius:50%;background:currentColor}
.band-pill.status-green{color:var(--good)}
.band-pill.status-yellow{color:var(--signal)}
.band-pill.status-red{color:var(--bad)}

/* Secondary row: sleep-perf ring + strain gauge — different encodings for different scales */
.secondary-row{display:flex;align-items:center;gap:18px;margin-top:22px;padding:0 4px}
.mini-ring-wrap{position:relative;width:64px;height:64px;flex-shrink:0}
.mini-ring-wrap svg{transform:rotate(-90deg)}
.mini-ring-track{fill:none;stroke:var(--surface-2);stroke-width:6}
.mini-ring-progress{fill:none;stroke-width:6;stroke-linecap:round;transition:stroke-dashoffset 1s cubic-bezier(.4,0,.2,1)}
.mini-ring-progress.status-green{stroke:var(--good)}
.mini-ring-progress.status-yellow{stroke:var(--signal)}
.mini-ring-progress.status-red{stroke:var(--bad)}
.mini-ring-progress.status-empty{stroke:var(--hairline)}
.mini-ring-center{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-family:var(--font-mono);font-size:14px;font-weight:600}
.metric-block{flex:1;text-align:left}
.metric-block .m-lbl{font-size:10.5px;color:var(--text-faint);margin-bottom:6px}
.metric-block .m-val{font-family:var(--font-mono);font-size:13px;color:var(--text-dim);margin-bottom:6px}
.metric-block .m-val b{color:var(--text);font-weight:600}
.gauge-track{position:relative;height:6px;background:var(--surface-2);border-radius:3px;overflow:visible}
.gauge-fill{position:absolute;left:0;top:0;height:100%;border-radius:3px;transition:width 1s cubic-bezier(.4,0,.2,1)}
.gauge-fill.status-green{background:var(--good)}
.gauge-fill.status-yellow{background:var(--signal)}
.gauge-fill.status-red{background:var(--bad)}
.gauge-fill.status-empty{background:var(--hairline)}
.gauge-ticks{display:flex;justify-content:space-between;margin-top:5px;font-family:var(--font-mono);font-size:9px;color:var(--text-faint)}

/* ===== Narrative ===== */
.narrative-summary{font-size:14px;font-weight:500;line-height:1.6;margin-bottom:16px;color:var(--text)}
.narrative-block{margin-top:14px;font-size:13px;line-height:1.75;color:var(--text-dim)}
.narrative-block strong{display:block;color:var(--text);font-size:12px;font-weight:600;margin-bottom:3px}
.tag-good{color:var(--good);font-weight:600}
.tag-warn{color:var(--signal);font-weight:600}
.tag-bad{color:var(--bad);font-weight:600}
.action-list{margin-top:16px;padding-top:14px;border-top:1px solid var(--hairline-soft)}
.action-list .al-title{font-size:12px;font-weight:600;color:var(--good);margin-bottom:8px}
.action-list ul{list-style:none}
.action-list li{font-size:13px;color:var(--text-dim);padding-left:16px;position:relative;margin-bottom:6px;line-height:1.5}
.action-list li::before{content:'—';position:absolute;left:0;color:var(--text-faint)}

/* ===== Activity data row (quiet, mono-aligned, no card box) ===== */
.activity-row{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:16px}
.activity-row .a-sport{font-size:14px;font-weight:600}
.activity-row .a-date{font-family:var(--font-mono);font-size:11px;color:var(--text-faint);margin-top:2px}
.activity-stats{display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
.activity-stats .a-stat{text-align:right}
.activity-stats .a-stat:first-child{text-align:left}
.activity-stats .a-val{font-family:var(--font-mono);font-size:15px;font-weight:600}
.activity-stats .a-lbl{font-size:9.5px;color:var(--text-faint);margin-top:3px}

/* ===== Stat strip (replaces boxed 2x2 card grid) ===== */
.stat-strip{display:flex;border:1px solid var(--hairline);border-radius:10px;overflow:hidden}
.stat-strip .stat{flex:1;padding:14px 10px;text-align:center;border-left:1px solid var(--hairline-soft)}
.stat-strip .stat:first-child{border-left:none}
.stat .s-val{font-family:var(--font-mono);font-size:17px;font-weight:600}
.stat .s-val.status-green{color:var(--good)}
.stat .s-val.status-yellow{color:var(--signal)}
.stat .s-val.status-red{color:var(--bad)}
.stat .s-lbl{font-size:9.5px;color:var(--text-faint);margin-top:5px;letter-spacing:0.02em}

/* ===== Tables — mono for column alignment ===== */
table{width:100%;border-collapse:collapse;font-family:var(--font-mono);font-size:11.5px}
th{text-align:left;padding:9px 8px;color:var(--text-faint);font-weight:500;border-bottom:1px solid var(--hairline);font-size:10px;letter-spacing:0.02em}
td{padding:9px 8px;border-bottom:1px solid var(--hairline-soft);color:var(--text-dim)}
tr:last-child td{border-bottom:none}
tr:hover td{color:var(--text)}

.badge{display:inline-block;padding:2px 8px;border-radius:20px;font-size:10px;font-weight:500;border:1px solid var(--hairline);color:var(--text-dim);font-family:var(--font-sans)}
.badge.ok{color:var(--good);border-color:rgba(70,198,133,0.35)}
.badge.warn{color:var(--signal);border-color:rgba(232,163,61,0.4)}
.badge.danger{color:var(--bad);border-color:rgba(229,86,107,0.4)}

/* ===== Sleep stage bar ===== */
.stage-bar{display:flex;height:8px;border-radius:4px;overflow:hidden;margin-top:10px}
.stage-deep{background:#8b7ae0}
.stage-light{background:#5b9bd5}
.stage-rem{background:var(--signal)}
.stage-awake{background:var(--bad)}
.legend{display:flex;gap:16px;margin-top:12px;font-family:var(--font-mono);font-size:10.5px;color:var(--text-dim);flex-wrap:wrap}
.legend-dot{display:inline-block;width:6px;height:6px;border-radius:50%;margin-right:5px}

.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--hairline);border:1px solid var(--hairline);border-radius:10px;overflow:hidden}
.grid-2 .g-cell{background:var(--surface);padding:14px}
.grid-2 .g-cell h4{font-size:10px;color:var(--text-faint);font-weight:500;margin-bottom:6px}
.grid-2 .g-cell .g-val{font-family:var(--font-mono);font-size:18px;font-weight:600}
.grid-2 .g-cell .g-sub{font-size:10px;color:var(--text-faint);margin-top:2px}

.empty{text-align:center;padding:44px 20px;color:var(--text-faint)}
.empty .e-icon{font-size:26px;margin-bottom:10px;opacity:0.5}
.empty p{font-size:13px;line-height:1.6;max-width:280px;margin:0 auto}

/* ===== Journal form ===== */
.field{margin-bottom:14px}
.field label{display:block;font-size:11px;color:var(--text-faint);margin-bottom:6px}
.field input,.field select{width:100%;padding:9px 10px;background:var(--surface);border:1px solid var(--hairline);border-radius:6px;color:var(--text);font-family:var(--font-sans);font-size:13px}
.field input:focus,.field select:focus{border-color:var(--signal)}
.field-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:8px}
.btn-primary{background:var(--signal);color:#1a1206;border:none;padding:10px 18px;border-radius:6px;cursor:pointer;font-size:13px;font-weight:600;font-family:var(--font-sans)}
.btn-primary:hover{filter:brightness(1.08)}

.overflow-x{overflow-x:auto}
canvas{max-width:100%}
</style>
</head>
<body>
<div class="topbar">
  <div class="brand">
    <h1>COROS</h1>
    <div class="sub">HEALTH.MONITOR</div>
  </div>
  <div><span class="live-dot"></span><span class="live-label">Synced</span></div>
</div>
<main class="main" id="main"></main>
<nav class="tabbar">
<a href="#" class="active" data-page="dashboard"><span class="icon">🏠</span>Dashboard</a>
<a href="#" data-page="sleep"><span class="icon">🌙</span>Sleep</a>
<a href="#" data-page="recovery"><span class="icon">⚡</span>Recovery</a>
<a href="#" data-page="breathing"><span class="icon">🫁</span>Breathing</a>
<a href="#" data-page="journal"><span class="icon">📓</span>Journal</a>
<a href="#" data-page="activities"><span class="icon">🏃</span>Activities</a>
</nav>
<script src="app.js"></script>
</body>
</html>
