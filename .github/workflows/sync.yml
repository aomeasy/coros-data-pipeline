name: COROS Daily Sync

on:
  schedule:
    - cron: '0 1 * * *'  # 9:00 AM ICT = 1:00 AM UTC
  workflow_dispatch:

jobs:
  sync:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install COROS-MCP
        run: npm install -g coros-mcp

      - name: Init DB
        run: python -c "import coros_db; coros_db.init_db()"

      - name: Run Sync
        env:
          COROS_EMAIL: ${{ secrets.COROS_EMAIL }}
          COROS_PASSWORD: ${{ secrets.COROS_PASSWORD }}
          PYTHONIOENCODING: utf-8
        run: python coros_daily_sync.py

      - name: Export to JSON
        run: python export.py

      - name: Commit DB + docs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f coros_cache.db docs/data.json
          if (git diff --cached --quiet) { echo "No changes" } else { git commit -m "Sync $(date -u +%Y-%m-%dT%H:%M:%SZ)"; git push }
