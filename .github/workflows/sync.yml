name: COROS Daily Sync

on:
  schedule:
    - cron: '30 23 * * *'  # 06:30 ICT = 23:30 UTC (วันก่อนหน้า)
    - cron: '0 11 * * *'   # 18:00 ICT = 11:00 UTC
    - cron: '0 15 * * *'   # 22:00 ICT = 15:00 UTC
  workflow_dispatch:
    inputs:
      bootstrap:
        description: 'ครั้งแรกครั้งเดียว: ส่ง coros_cache.db ที่ commit อยู่ขึ้น D1 ก่อน pull'
        type: boolean
        default: false
      chat_id:
        description: 'Telegram chat id ที่จะให้ส่งสรุปไป (เว้นว่าง = ใช้ค่าจาก secret)'
        type: string
        required: false
        default: ''
        

# กันสองรอบรันซ้อนกัน (เช่น รันมือตอนที่ cron ทำงานอยู่)
concurrency:
  group: coros-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: pip install -r requirements.txt requests

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install COROS-MCP
        run: npm install -g coros-mcp

      - name: Init DB
        run: python -c "import coros_db; coros_db.init_db()"

      # ทำเฉพาะตอนกด Run workflow เองแล้วติ๊ก bootstrap: อัปโหลดข้อมูลใน .db ที่ commit อยู่ขึ้น D1
      - name: Bootstrap D1 from committed DB (one-time)
        if: ${{ github.event.inputs.bootstrap == 'true' }}
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_D1_ID: ${{ secrets.CF_D1_ID }}
          PYTHONIOENCODING: utf-8
        run: python d1_sync.py push

      # ถ้า pull ล้มเหลว job จะหยุดทันที (ไม่ให้ทำงานต่อบนฐานข้อมูลว่าง)
      - name: Pull DB from D1
        id: pull
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_D1_ID: ${{ secrets.CF_D1_ID }}
          PYTHONIOENCODING: utf-8
        run: python d1_sync.py pull

      - name: Run Sync
        env:
          COROS_EMAIL: ${{ secrets.COROS_EMAIL }}
          COROS_PASSWORD: ${{ secrets.COROS_PASSWORD }}
          PYTHONIOENCODING: utf-8
        run: python coros_daily_sync.py
        
      - name: Sync FIT records
        continue-on-error: true      # FIT พลาดไม่ต้องทำให้ sync หลักล้ม
        env:
          PYTHONIOENCODING: utf-8
        run: python fit_sync.py
        
      - name: Compute Strain / ACWR
        env:
          PYTHONIOENCODING: utf-8
        run: python run_strain.py

      - name: Export to JSON
        run: python export.py

      - name: Send Telegram Summary
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ github.event.inputs.chat_id || secrets.TELEGRAM_CHAT_ID }}
          PYTHONIOENCODING: utf-8
        run: python telegram_notify.py

      # ส่งขึ้น D1 ทุกครั้งที่ pull สำเร็จ แม้ขั้นตอนกลาง (เช่น Telegram) จะพลาด
      # ตั้งไว้หลัง Telegram เพราะ telegram_notify.py เขียน cache ลง DB ด้วย
      - name: Push DB to D1
        if: ${{ always() && steps.pull.outcome == 'success' }}
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_D1_ID: ${{ secrets.CF_D1_ID }}
          PYTHONIOENCODING: utf-8
        run: python d1_sync.py push

      # หมายเหตุ: ไม่ commit coros_cache.db อีกแล้ว
      # แต่ docs/data.json (ข้อมูลสุขภาพสรุป) ยังถูก commit ขึ้น repo ตามเดิม
      - name: Commit docs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f docs/data.json
          if (git diff --cached --quiet) {
            echo "No changes"
          } else {
            $ts = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
            git commit -m "Sync $ts"
            git push
          }


      - name: Notify on failure
        if: ${{ failure() }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ github.event.inputs.chat_id || secrets.TELEGRAM_CHAT_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          $body = @{
            chat_id = $env:TELEGRAM_CHAT_ID
            text    = "❌ COROS sync ล้มเหลว`n$env:RUN_URL"
          }
          Invoke-RestMethod -Method Post -Uri "https://api.telegram.org/bot$($env:TELEGRAM_BOT_TOKEN)/sendMessage" -Body $body
          
