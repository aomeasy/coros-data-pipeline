name: Tests

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  pytest:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run test suite
        run: pytest -v
        
      - name: Compile-check every module (catches syntax errors fast)
        run: |
          python -m py_compile coros_daily_sync.py coros_db.py data_validation.py \
            logging_utils.py app.py breath_analysis.py sleep_analysis.py export.py \
            baseline_engine.py
            
